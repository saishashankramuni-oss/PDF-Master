services:
  - type: web
    name: pdf-master-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: JOB_RETENTION_MINUTES
        value: "30"
      - key: LOG_LEVEL
        value: "INFO"
      - key: ALLOWED_ORIGINS
        value: "https://pdf-master.vercel.app"
