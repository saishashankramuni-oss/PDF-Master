services:
  - type: web
    name: pdf-master-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: "production"
      - key: MAX_FILE_SIZE_MB
        value: "50"
      - key: JOB_RETENTION_MINUTES
        value: "30"
      - key: LOG_LEVEL
        value: "INFO"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://pdf-master.vercel.app"
    healthCheckPath: /health
    autoDeploy: true
