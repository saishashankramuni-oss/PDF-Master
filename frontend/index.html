<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Master - Universal PDF Processing</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Universal PDF processing web application">
</head>
<body class="bg-white dark:bg-gray-900 text-gray-900 antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <!-- PWA Install Prompt -->
  <div id="pwa-install" class="fixed bottom-4 left-1/2 -translate-x-1/2 hidden z-50">
    <div class="bg-white dark:bg-gray-800 rounded-lg p-6 shadow-lg border border-gray-200 dark:border-gray-700 max-w-md w-full">
      <h3 class="text-lg font-bold text-gray-900 dark:text-gray-100 mb-3">Install PDF Master</h3>
      <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">
        Install PDF Master on your device for quick access and offline support.
      </p>
      <div class="flex gap-3">
        <button id="install-yes" class="bg-primary-600 text-white px-6 py-3 rounded-lg font-medium hover:bg-primary-700 transition-colors">
          Install
        </button>
        <button id="install-no" class="border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 px-6 py-3 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
          Not Now
        </button>
      </div>
    </div>
  </div>
</body>
</html>
